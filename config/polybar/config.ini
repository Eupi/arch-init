[colors]
background = #0c0e12
background-alt = #5e370a
foreground = #ffffff
primary = #f5b740
secondary = #8ABEB7
alert = #A54242
disabled = #596169

shade-1 = #5D5E72
shade-2 = #7A7B8C
shade-3 = #A0A0AB
shade-4 = #CACACE
shade-5 = #F8F8F8

[bar/eupi]
locale = ru_RU.UTF-8

width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

#separator = |
#separator-foreground = ${colors.disabled}

#font-0 = monospace;2
font-0 = "FiraCode Nerd Font Mono:size=10;3"
font-1 = "feather:size=10;3"
font-2 = "Material Icons Outlined:size=11;4"
font-3 = "Material Icons Round:size=11;4"
font-4 = "Material Icons Sharp:size=11;4"
font-5 = "Material Icons TwoTone:size=11;4"

#modules-center = xwindow
modules-left = xworkspaces
modules-center = date updates-pacman-aurhelper
modules-right = eth pulseaudio xkeyboard cpu memory filesystem wlan battery session

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}SSD%{F-} %percentage_used%%
#label-mounted = SSD %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/updates-pacman-aurhelper]
type = custom/script
exec = $HOME/.config/polybar/scripts/updates-pacman-aurhelper.sh
interval = 600


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 1
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
#format-prefix = "RAM "
format-prefix = %{T5}%{T-}
format-prefix-padding = 1
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T5}%{T-}
format-prefix-padding = 1
#format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interface = enp0s3
interval = 1
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

;[module/wlan]
;inherit = network-base
;interface-type = wireless
;label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#42B5EB}%upspeed%%{F-} %{F#A6EC83}%downspeed%
label-connected-padding = 2

[module/battery]
type = internal/battery

full-at = 99
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

format-charging-prefix = "󱐋 " 
format-discharging-prefix = "󱐋 " 

poll-interval = 5

[module/date]
type = internal/date
interval = 1

date = "%H:%M"
date-alt = %a,%d %b %H:%M
label = %date%
label-foreground = ${colors.primary}

[module/session]
type = custom/text

click-left = lxsession-logout -p ""
content = %{T9}%{T-}
content-background = ${colors.background}
content-foreground = ${colors.foreground}
content-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
